<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Карточки лекарств</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="./modal.css" />
  </head>
  <body>
    <!-- Карточки -->
    <div class="cards-grid">
      <div class="med-card">
        <div class="med-card-header">
          <div class="med-icon" style="background: #e6f1fb">
            <i class="ti ti-pill" style="font-size: 18px; color: #185fa5"></i>
          </div>
          <div>
            <p style="font-weight: 500; font-size: 15px">Парацетамол</p>
            <p style="font-size: 12px; color: #888">500 мг</p>
          </div>
        </div>
        <p class="category">Жаропонижающее, обезболивающее</p>
        <button class="btn-details" onclick="openModal('paracetamol')">
          Подробнее
        </button>
      </div>

      <div class="med-card">
        <div class="med-card-header">
          <div class="med-icon" style="background: #e1f5ee">
            <i class="ti ti-pill" style="font-size: 18px; color: #0f6e56"></i>
          </div>
          <div>
            <p style="font-weight: 500; font-size: 15px">Ибупрофен</p>
            <p style="font-size: 12px; color: #888">400 мг</p>
          </div>
        </div>
        <p class="category">Противовоспалительное, обезболивающее</p>
        <button class="btn-details" onclick="openModal('ibuprofen')">
          Подробнее
        </button>
      </div>

      <div class="med-card">
        <div class="med-card-header">
          <div class="med-icon" style="background: #faeeda">
            <i class="ti ti-pill" style="font-size: 18px; color: #854f0b"></i>
          </div>
          <div>
            <p style="font-weight: 500; font-size: 15px">Амоксициллин</p>
            <p style="font-size: 12px; color: #888">250 мг</p>
          </div>
        </div>
        <p class="category">Антибиотик широкого спектра</p>
        <button class="btn-details" onclick="openModal('amoxicillin')">
          Подробнее
        </button>
      </div>
    </div>

    <!-- Одно модальное окно для всех карточек -->
    <div
      class="modal-overlay"
      id="modal-overlay"
      onclick="handleOverlayClick(event)"
    >
      <div class="modal-box">
        <button class="modal-close" onclick="closeModal()" aria-label="Закрыть">
          <i class="ti ti-x"></i>
        </button>

        <div class="modal-header">
          <div class="modal-icon" id="modal-icon"></div>
          <div>
            <p id="modal-name" style="font-weight: 500; font-size: 18px"></p>
            <p id="modal-dose" style="font-size: 13px; color: #888"></p>
          </div>
        </div>

        <div class="modal-body">
          <div class="modal-field">
            <p class="label">Показания</p>
            <p class="value" id="modal-indications"></p>
          </div>
          <div class="modal-field">
            <p class="label">Применение</p>
            <p class="value" id="modal-usage"></p>
          </div>
          <div class="modal-field">
            <p class="label">Противопоказания</p>
            <p class="value" id="modal-contraindications"></p>
          </div>
          <div class="modal-field">
            <p class="label">Побочные эффекты</p>
            <p class="value" id="modal-sideeffects"></p>
          </div>
        </div>
      </div>
    </div>
    <script src="./modal.js"></script>
  </body>
</html>
